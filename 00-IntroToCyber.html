                    "Lack of mandatory security baseline requirements for Tier-1 and Tier-2 suppliers.",
                    "Inadequate auditing of supplier operational resilience.",
                    "Information sharing silos between primary manufacturers and component vendors."
                ],
                controls: [
                    "Mandatory cybersecurity compliance frameworks (e.g., NIST SP 800-161) for all vendors.",
                    "Continuous third-party risk monitoring and automated risk scoring.",
                    "Requirement of operational redundancy and manual operational contingency plans.",
                    "Establishment of joint Threat Intelligence Sharing programs across suppliers."
                ],
                quiz: {
                    question: "Scenario: You manage a JIT automotive manufacturing line. How do you prevent a small supplier’s cyber breach from stopping your entire production line?",
                    options: [
                        "Mandate security baselines and require buffer inventory reserves alongside supplier risk audits.",
                        "Trust that small suppliers won't be targeted.",
                        "Fines suppliers after a breach occurs.",
                        "Eliminate all supplier oversight to save costs."
                    ],
                    correct: 0,
                    explanation: "Combining strict cybersecurity requirements with strategic buffer stock mitigates both digital exposure and physical operational halt risks."
                }
            },
            {
                id: 13,
                title: "Module 13. Information Security Management & Compliance",
                icon: "fa-gavel",
                caseTitle: "Software Supply Chain Compliance & Framework Failures",
                caseDetails: "A major defense logistics contractor failed to adhere to NIST SP 800-171 cybersecurity requirements, leading to unauthorized exfiltration of sensitive military transport schedules by foreign intelligence entities. The firm faced severe Department of Justice False Claims Act penalties.",
                whySucceeded: "The company treated cybersecurity compliance as a 'check-the-box' exercise, utilizing static self-assessments without continuous enforcement of security controls or executive accountability.",
                vulnerabilities: [
                    "Static, annual 'paper-only' security self-assessments.",
                    "Lack of alignment with structured cybersecurity frameworks (NIST CSF, ISO/IEC 27001).",
                    "Absence of continuous compliance verification and executive governance oversight.",
                    "Ignoring regulatory mandates (CMMC, NIS2, ISO 28000)."
                ],
                controls: [
                    "Adoption of ISO 28000 (Security Management Systems for Supply Chain) & NIST SP 800-161.",
                    "Automated, continuous compliance monitoring platforms.",
                    "Executive Security Steering Committees with direct board reporting.",
                    "Third-party independent cybersecurity audits and penetration testing."
                ],
                quiz: {
                    question: "Scenario: Which framework is specifically designed to manage cybersecurity risks throughout enterprise supply chain relationships?",
                    options: [
                        "PCI-DSS (Payment Card Industry standard only)",
                        "NIST SP 800-161 (Cybersecurity Supply Chain Risk Management / C-SCRM)",
                        "GDPR (Data Privacy Directive only)",
                        "IEEE 802.11 Wireless Standard"
                    ],
                    correct: 1,
                    explanation: "NIST SP 800-161 explicitly provides guidance for identifying, assessing, and mitigating cybersecurity risks across information supply chains."
                }
            }
        ];

        // Glossary Terms Database
        const glossaryData = [
            { term: "Air-Gapping", def: "A security measure that involves isolating a computer or network and ensuring that it is physically disconnected from any other networks, including the internet." },
            { term: "APT (Advanced Persistent Threat)", def: "A stealthy threat actor, typically a state or state-sponsored group, that gains unauthorized access to a computer network and remains undetected for an extended period." },
            { term: "C-SCRM", def: "Cybersecurity Supply Chain Risk Management—a systematic process for managing cyber risks associated with acquiring third-party products and services." },
            { term: "CVE (Common Vulnerabilities and Exposures)", def: "A public list of standardized identifiers for publicly known cybersecurity vulnerabilities." },
            { term: "DFIR (Digital Forensics & Incident Response)", def: "A specialized field of cybersecurity focused on the identification, investigation, containment, and remediation of cyber incidents." },
            { term: "EDR (Endpoint Detection and Response)", def: "An integrated endpoint security solution that combines real-time continuous monitoring and data collection with rules-based automated response." },
            { term: "IAM (Identity and Access Management)", def: "A framework of policies and technologies ensuring that the right users have the appropriate access to technology resources." },
            { term: "ICS/SCADA", def: "Industrial Control Systems / Supervisory Control and Data Acquisition architectures used to monitor and automate industrial processes like port cranes and water utilities." },
            { term: "Least Privilege", def: "The security principle that end users and systems should be granted the minimum level of access—and permissions—necessary to perform their official duties." },
            { term: "MFA (Multi-Factor Authentication)", def: "An authentication method that requires the user to provide two or more verification factors to gain access to a resource." },
            { term: "Micro-segmentation", def: "A security technique that enables fine-grained security zones to be created in data centers and cloud environments to isolate workloads and limit lateral movement." },
            { term: "OT (Operational Technology)", def: "Hardware and software that detects or causes a change through the direct monitoring and/or control of physical devices, processes, and events in the enterprise." },
            { term: "PAM (Privileged Access Management)", def: "Identities and systems management focused on securing, controlling, and monitoring elevated access to critical assets." },
            { term: "Purdue Model", def: "A structural model for industrial control system architecture that defines network segmentation zones between physical equipment and corporate IT networks." },
            { term: "Ransomware", def: "A type of malicious software designed to block access to a computer system or files until a sum of money is paid." },
            { term: "SBOM (Software Bill of Materials)", def: "A formal, machine-readable inventory of software components, dependencies, and hierarchical relationships within an application." },
            { term: "SIEM (Security Information and Event Management)", def: "A security solution that aggregates and analyzes log data from across an enterprise to detect potential threats and compliance issues." },
            { term: "SOAR (Security Orchestration, Automation, and Response)", def: "Technologies that enable organizations to collect threat indicators and automate response playbooks without human intervention." },
            { term: "WIPS (Wireless Intrusion Prevention System)", def: "A security hardware/software tool that monitors the radio spectrum for rogue access points, unauthorized wireless connections, and RF attacks." },
            { term: "Zero Trust Architecture (ZTA)", def: "A cybersecurity strategy built on the principle of 'Never Trust, Always Verify', requiring strict identity verification for every device and user attempting to access resources." }
        ];

        // State Tracking
        let currentModuleIndex = 0;
        let completedModules = new Set();
        let userAnswers = {};

        // DOM Loaded Init
        window.onload = function() {
            renderSidebar();
            renderModule(0);
            updateProgress();

            // Mobile sidebar toggle logic
            document.getElementById('sidebar-toggle').addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('-translate-x-full');
            });
        };

        // Render Sidebar Navigation
        function renderSidebar() {
            const list = document.getElementById('module-nav-list');
            list.innerHTML = '';

            courseData.forEach((mod, index) => {
                const isCompleted = completedModules.has(mod.id);
                const isActive = currentModuleIndex === index;

                const button = document.createElement('button');
                button.className = `w-full text-left p-2.5 rounded-lg text-xs font-mono transition flex items-center justify-between mb-1 ${
                    isActive 
                        ? 'bg-cyber-cyan/15 text-cyber-cyan border border-cyber-cyan/40 glow-text-cyan' 
                        : 'text-cyber-muted hover:bg-cyber-card hover:text-white'
                }`;

                button.onclick = () => {
                    renderModule(index);
                    // Close mobile sidebar on selection
                    document.getElementById('sidebar').classList.add('-translate-x-full');
                };

                button.innerHTML = `
                    <div class="flex items-center gap-2.5 overflow-hidden">
                        <i class="fa-solid ${mod.icon} text-sm ${isActive ? 'text-cyber-cyan' : 'text-cyber-muted'}"></i>
                        <span class="truncate">${mod.title}</span>
                    </div>
                    ${isCompleted ? '<i class="fa-solid fa-circle-check text-cyber-green ml-1"></i>' : ''}
                `;

                list.appendChild(button);
            });
        }

        // Render Specific Module
        function renderModule(index) {
            currentModuleIndex = index;
            renderSidebar();

            const mod = courseData[index];
            const main = document.getElementById('main-content');

            main.innerHTML = `
                <!-- Module Header -->
                <div class="border-b border-cyber-border pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-2 text-xs font-mono text-cyber-cyan mb-1">
                            <span>IDIS-3815 // COURSE MODULE ${String(mod.id).padStart(2, '0')}</span>
                        </div>
                        <h2 class="text-xl md:text-2xl font-bold font-mono text-white tracking-wide">${mod.title}</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="navigateModule(-1)" ${index === 0 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-3 py-1.5 rounded border border-cyber-border bg-cyber-card text-xs font-mono hover:border-cyber-cyan transition">
                            <i class="fa-solid fa-arrow-left mr-1"></i> PREV
                        </button>
                        <button onclick="navigateModule(1)" ${index === courseData.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed"' : ''} class="px-3 py-1.5 rounded border border-cyber-border bg-cyber-card text-xs font-mono hover:border-cyber-cyan transition">
                            NEXT <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>

                <!-- Case Study Box -->
                <div class="cyber-card rounded-xl p-5 border-l-4 border-l-cyber-red">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-mono px-2 py-0.5 rounded bg-cyber-red/10 border border-cyber-red/30 text-cyber-red font-semibold uppercase">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> Real-World Cyber Incident
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2 font-mono">${mod.caseTitle}</h3>
                    <p class="text-sm text-cyber-text leading-relaxed mb-4">${mod.caseDetails}</p>
                    <div class="p-3 bg-cyber-bg/80 rounded-lg border border-cyber-border">
                        <h4 class="text-xs font-mono text-cyber-cyan uppercase font-bold mb-1"><i class="fa-solid fa-bug mr-1"></i> Root Cause & Exploit Vectors:</h4>
                        <p class="text-xs text-cyber-muted leading-relaxed">${mod.whySucceeded}</p>
                    </div>
                </div>

                <!-- Content Grid: Vulnerabilities & Controls -->
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Vulnerabilities Card -->
                    <div class="cyber-card rounded-xl p-5">
                        <h3 class="text-sm font-mono text-cyber-red font-bold uppercase mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-shield-virus"></i> Common Vulnerabilities
                        </h3>
                        <ul class="space-y-2.5">
                            ${mod.vulnerabilities.map(v => `
                                <li class="flex items-start gap-2.5 text-xs text-cyber-text">
                                    <i class="fa-solid fa-xmark text-cyber-red mt-0.5"></i>
                                    <span>${v}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <!-- Defense Controls Card -->
                    <div class="cyber-card rounded-xl p-5">
                        <h3 class="text-sm font-mono text-cyber-green font-bold uppercase mb-4 flex items-center gap-2">
                            <i class="fa-solid fa-lock"></i> Mitigation Controls & Strategies
                        </h3>
                        <ul class="space-y-2.5">
                            ${mod.controls.map(c => `
                                <li class="flex items-start gap-2.5 text-xs text-cyber-text">
                                    <i class="fa-solid fa-check text-cyber-green mt-0.5"></i>
                                    <span>${c}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>

                <!-- Interactive Activity Section -->
                <div class="cyber-card rounded-xl p-5 border border-cyber-cyan/30">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-mono text-cyber-cyan font-bold uppercase flex items-center gap-2">
                            <i class="fa-solid fa-vial"></i> Interactive Scenario Knowledge Assessment
                        </h3>
                        <span class="text-xs font-mono text-cyber-muted">Instant Evaluation</span>
                    </div>

                    <p class="text-sm font-semibold text-white mb-4">${mod.quiz.question}</p>

                    <div class="space-y-2 mb-4" id="quiz-options">
                        ${mod.quiz.options.map((opt, i) => `
                            <button onclick="submitAnswer(${index}, ${i})" class="w-full text-left p-3 rounded-lg bg-cyber-bg border border-cyber-border hover:border-cyber-cyan/50 text-xs text-cyber-text transition flex items-center justify-between group">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle text-cyber-muted group-hover:text-cyber-cyan"></i>
                            </button>
                        `).join('')}
                    </div>

                    <div id="quiz-feedback" class="hidden p-3 rounded-lg text-xs leading-relaxed font-mono"></div>
                </div>
            `;

            // If user already answered this module, display their answer state
            if (userAnswers[index] !== undefined) {
                showQuizResult(index, userAnswers[index]);
            }
        }

        // Handle Quiz Submissions
        function submitAnswer(modIndex, selectedIndex) {
            userAnswers[modIndex] = selectedIndex;
            const mod = courseData[modIndex];

            if (selectedIndex === mod.quiz.correct) {
                completedModules.add(mod.id);
            }

            updateProgress();
            renderSidebar();
            showQuizResult(modIndex, selectedIndex);
        }

        // Render Feedback for Quiz
        function showQuizResult(modIndex, selectedIndex) {
            const mod = courseData[modIndex];
            const feedbackBox = document.getElementById('quiz-feedback');
            const optionsBox = document.getElementById('quiz-options');

            if (!feedbackBox || !optionsBox) return;

            const isCorrect = selectedIndex === mod.quiz.correct;

            // Update Option Styling
            optionsBox.innerHTML = mod.quiz.options.map((opt, i) => {
                let btnStyle = 'bg-cyber-bg border-cyber-border text-cyber-text';
                let icon = '<i class="fa-regular fa-circle text-cyber-muted"></i>';

                if (i === mod.quiz.correct) {
                    btnStyle = 'bg-cyber-green/15 border-cyber-green text-cyber-green font-bold';
                    icon = '<i class="fa-solid fa-circle-check text-cyber-green"></i>';
                } else if (i === selectedIndex && !isCorrect) {
                    btnStyle = 'bg-cyber-red/15 border-cyber-red text-cyber-red font-bold';
                    icon = '<i class="fa-solid fa-circle-xmark text-cyber-red"></i>';
                }

                return `
                    <div class="w-full text-left p-3 rounded-lg border ${btnStyle} text-xs flex items-center justify-between">
                        <span>${opt}</span>
                        ${icon}
                    </div>
                `;
            }).join('');

            // Display Feedback Box
            feedbackBox.classList.remove('hidden');
            if (isCorrect) {
                feedbackBox.className = 'p-3 rounded-lg text-xs leading-relaxed font-mono bg-cyber-green/10 border border-cyber-green/30 text-cyber-green';
                feedbackBox.innerHTML = `<i class="fa-solid fa-circle-check mr-2"></i> <strong>CORRECT EXECUTION:</strong> ${mod.quiz.explanation}`;
            } else {
                feedbackBox.className = 'p-3 rounded-lg text-xs leading-relaxed font-mono bg-cyber-red/10 border border-cyber-red/30 text-cyber-red';
                feedbackBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2"></i> <strong>SECURITY BREACH:</strong> Incorrect protocol selected. ${mod.quiz.explanation}`;
            }
        }

        // Navigation controls
        function navigateModule(direction) {
            const newIndex = currentModuleIndex + direction;
            if (newIndex >= 0 && newIndex < courseData.length) {
                renderModule(newIndex);
            }
        }

        // Progress Calculation
        function updateProgress() {
            const percent = Math.round((completedModules.size / courseData.length) * 100);
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('completed-count').innerText = `${completedModules.size}/${courseData.length} Done`;
        }

        // Glossary & Interface Tab Switcher
        function switchTab(tab) {
            const main = document.getElementById('main-content');

            if (tab === 'glossary') {
                renderSidebar();
                main.innerHTML = `
                    <div class="border-b border-cyber-border pb-4 flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                        <div>
                            <span class="text-xs font-mono text-cyber-cyan">REFERENCE MATRIX</span>
                            <h2 class="text-2xl font-bold font-mono text-white tracking-wide"><i class="fa-solid fa-book-bookmark text-cyber-purple mr-2"></i> Supply Chain Cybersecurity Glossary</h2>
                        </div>
                        <div class="w-full sm:w-64">
                            <input type="text" id="glossary-search" oninput="filterGlossary()" placeholder="Search terms..." class="w-full px-3 py-1.5 rounded bg-cyber-card border border-cyber-border text-xs font-mono text-white focus:outline-none focus:border-cyber-cyan">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4" id="glossary-grid">
                        <!-- Glossary Items populated by JS -->
                    </div>
                `;
                renderGlossaryItems(glossaryData);
            }
        }

        // Render Glossary Grid
        function renderGlossaryItems(items) {
            const grid = document.getElementById('glossary-grid');
            if (!grid) return;

            grid.innerHTML = items.map(item => `
                <div class="cyber-card rounded-xl p-4 border border-cyber-border">
                    <h3 class="text-sm font-mono font-bold text-cyber-cyan mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-terminal text-xs text-cyber-purple"></i> ${item.term}
                    </h3>
                    <p class="text-xs text-cyber-muted leading-relaxed">${item.def}</p>
                </div>
            `).join('');
        }

        // Filter Glossary Items
        function filterGlossary() {
            const query = document.getElementById('glossary-search').value.toLowerCase();
            const filtered = glossaryData.filter(g => 
                g.term.toLowerCase().includes(query) || g.def.toLowerCase().includes(query)
            );
            renderGlossaryItems(filtered);
        }
    </script>
</body>
</html>
